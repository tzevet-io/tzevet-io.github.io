<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tzevet</title>
<meta name="description" content="Tzevet — software for service businesses.">
<style>
  :root { --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #5f6368; --accent: #1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --card: #1b1c1f; --text: #ececec; --muted: #a0a4ab; --accent: #6ea8fe; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 32px; margin-bottom: 24px; }
  h1 { margin: 0 0 8px; font-size: 2.2rem; letter-spacing: .5px; }
  h2 { margin: 0 0 12px; font-size: 1.15rem; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  [dir="rtl"] { text-align: right; }
  footer { color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>Tzevet</h1>
    <p class="muted">Software for service businesses.</p>
  </section>

  <section class="card">
    <h2>Company</h2>
    <dl>
      <dt>Brand</dt><dd>Tzevet</dd>
      <dt>Operated by</dt><dd>Vladislav Pleskov (sole proprietor)</dd>
      <dt>Email</dt><dd><a href="mailto:admin@tzevet.io">admin@tzevet.io</a></dd>
    </dl>
  </section>

  <section class="card" dir="rtl" lang="he">
    <h2>צוות</h2>
    <p>תוכנה לעסקי שירות.</p>
    <p>צוות הוא שם מסחרי של <span dir="ltr">Vladislav Pleskov</span> (עוסק יחיד).</p>
    <p>יצירת קשר: <a href="mailto:admin@tzevet.io">admin@tzevet.io</a></p>
  </section>

  <footer>&copy; 2026 Tzevet &middot; Vladislav Pleskov</footer>
</main>
</body>
</html>
